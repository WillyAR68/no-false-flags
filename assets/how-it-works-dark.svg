<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-label="How it works: a flagged conversation holds material the task does not need; remove it with /rewind or a pointer-only handoff and /clear; keep working in a clean session on the top model."><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#3A2C16"/><line x1="0" y1="0" x2="0" y2="8" stroke="#E3A447" stroke-width="3" opacity=".5"/></pattern><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#48B8D4"/></marker></defs><rect width="1280" height="390" rx="18" fill="#0E1A21"/><text x="60" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#48B8D4" text-anchor="start">1</text><text x="82" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#E6EEF0" text-anchor="start">The conversation is flagged</text><text x="60" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8FA3AD" text-anchor="start">The check reads everything in it.</text><text x="470" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#48B8D4" text-anchor="start">2</text><text x="492" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#E6EEF0" text-anchor="start">Remove what the task does not need</text><text x="470" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8FA3AD" text-anchor="start">Rewind past it, or hand off and clear.</text><text x="880" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#48B8D4" text-anchor="start">3</text><text x="902" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#E6EEF0" text-anchor="start">Keep working, clean</text><text x="880" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8FA3AD" text-anchor="start">Then /model back to the top model.</text><rect x="60" y="120" width="340" height="28" rx="5" fill="#13232C" stroke="#24363F" stroke-width="1.5"/><text x="72" y="138.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#8FA3AD" text-anchor="start">task: GDPR erasure script</text><rect x="60" y="158" width="340" height="28" rx="5" fill="url(#h)" stroke="#E3A447" stroke-width="1.5"/><text x="72" y="176.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#E3A447" text-anchor="start">250-line doc from another project</text><rect x="60" y="196" width="340" height="28" rx="5" fill="#13232C" stroke="#24363F" stroke-width="1.5"/><text x="72" y="214.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#8FA3AD" text-anchor="start">half of the script</text><rect x="60" y="234" width="340" height="28" rx="5" fill="#3A2C16" stroke="#E3A447" stroke-width="1.5"/><text x="72" y="252.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#E3A447" text-anchor="start">⚠ stopped  ·  a retry trips it again</text><rect x="470" y="120" width="340" height="64" rx="8" fill="#13232C" stroke="#48B8D4" stroke-width="1.5"/><text x="484" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#48B8D4" text-anchor="start">Esc Esc   or   /rewind</text><text x="484" y="169" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3AD" text-anchor="start">when the turn that brought it in is known</text><text x="640" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#8FA3AD" text-anchor="middle">or</text><rect x="470" y="220" width="340" height="64" rx="8" fill="#13232C" stroke="#48B8D4" stroke-width="1.5"/><text x="484" y="247" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#48B8D4" text-anchor="start">handoff.md   then   /clear</text><text x="484" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3AD" text-anchor="start">pointers to files, never their content</text><rect x="880" y="120" width="340" height="28" rx="5" fill="#13232C" stroke="#24363F" stroke-width="1.5"/><text x="892" y="138.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#8FA3AD" text-anchor="start">handoff: goal, state, pending</text><rect x="880" y="158" width="340" height="28" rx="5" fill="#13232C" stroke="#24363F" stroke-width="1.5"/><text x="892" y="176.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#8FA3AD" text-anchor="start">half of the script</text><rect x="880" y="196" width="340" height="30" rx="5" fill="#123140" stroke="#48B8D4" stroke-width="1.5"/><text x="892" y="215.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#48B8D4" text-anchor="start">✓ top model  ·  work continues</text><line x1="410" y1="200" x2="458" y2="200" stroke="#48B8D4" stroke-width="2.5" marker-end="url(#a)"/><line x1="820" y1="200" x2="868" y2="200" stroke="#48B8D4" stroke-width="2.5" marker-end="url(#a)"/><line x1="60" y1="318" x2="1220" y2="318" stroke="#24363F" stroke-width="1.5"/><text x="60" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8FA3AD" text-anchor="start">Plus two hooks: long documents are read by section, and an automatic model fallback starts this recovery right away.</text></svg>